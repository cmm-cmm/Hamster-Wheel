[server]
listen = "127.0.0.1:8080"
max_connections = 1024
header_read_timeout = 30
body_read_timeout = 30
max_body_memory = 67108864
http1_max_buffer_size = 65536

[[hosts]]
name = "localhost"
aliases = ["127.0.0.1"]

[[hosts.locations]]
path = "/api"
handler = "not_found"

[[hosts.locations]]
path = "/php"
handler = "php_worker"

[hosts.locations.php]
executable = "php/8.5/php.exe"
script = "fixtures/php-worker/worker.php"
workers = 4
queue_capacity = 32
# Ceiling on one application transaction, in seconds (1-3600, default 5).
# Exceeding it kills and replaces the worker, so set it from the application's
# own p99 plus headroom; see doc/CONFIGURATION.md.
request_timeout = 5

[[hosts.locations]]
path = "/"
handler = "static"
root = "public"
