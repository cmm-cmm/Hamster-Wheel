name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Format, lint, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Ensure a PHP CLI is available
        run: |
          if ! command -v php > /dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes php-cli
          fi
          php --version

      - name: Format, lint, test
        run: ./scripts/check.sh

      - name: Smoke test the release build
        run: ./scripts/smoke.sh

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # The PHP worker tests report themselves skipped when no PHP CLI exists;
      # the runner image ships one, so they exercise the worker here too.
      - name: Build and test
        run: |
          cargo build --all-targets
          cargo test

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag hamster-wheel:ci .

      - name: Serve traffic from the image
        run: |
          docker run --detach --name hamster-ci --publish 8080:8080 hamster-wheel:ci
          HAMSTER_SMOKE_PHP=yes timeout 120 ./scripts/smoke.sh http://127.0.0.1:8080 \
            || { docker logs hamster-ci; exit 1; }

      - name: Stop container
        if: always()
        run: docker rm --force hamster-ci || true
