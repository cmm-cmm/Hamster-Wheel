name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The PHP worker targets this runtime everywhere: CI, containers, and the
  # runtime Windows developers vendor under php/8.5/.
  HAMSTER_PHP_VERSION: "8.5"

jobs:
  check:
    name: Format, lint, test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install PHP ${{ env.HAMSTER_PHP_VERSION }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.HAMSTER_PHP_VERSION }}

      # A silently older or thread-safe PHP would still pass the test suite
      # while testing a runtime the project does not ship against.
      - name: Verify PHP is ${{ env.HAMSTER_PHP_VERSION }} NTS 64-bit
        run: |
          php -r 'printf("PHP %s %s %d-bit\n", PHP_VERSION, PHP_ZTS ? "ZTS" : "NTS", PHP_INT_SIZE * 8);'
          php -r 'exit((version_compare(PHP_VERSION, getenv("HAMSTER_PHP_VERSION"), ">=") && !PHP_ZTS && PHP_INT_SIZE === 8) ? 0 : 1);'

      - name: Format, lint, test
        run: ./scripts/check.sh

      - name: Smoke test the release build
        run: ./scripts/smoke.sh

  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Windows is the project's primary platform, so the worker tests must run
      # against the same non-thread-safe 64-bit build developers vendor locally.
      # setup-php installs the non-thread-safe x64 build on Windows by default;
      # the verification step below is what actually enforces it.
      - name: Install PHP ${{ env.HAMSTER_PHP_VERSION }} (NTS, x64)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.HAMSTER_PHP_VERSION }}

      - name: Verify PHP is ${{ env.HAMSTER_PHP_VERSION }} NTS 64-bit
        run: |
          php -r 'printf("PHP %s %s %d-bit\n", PHP_VERSION, PHP_ZTS ? "ZTS" : "NTS", PHP_INT_SIZE * 8);'
          php -r 'exit((version_compare(PHP_VERSION, getenv("HAMSTER_PHP_VERSION"), ">=") && !PHP_ZTS && PHP_INT_SIZE === 8) ? 0 : 1);'

      - name: Build and test
        run: |
          cargo build --all-targets
          cargo test

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each stage asserts PHP 8.5 NTS 64-bit, so a wrong base image fails here.
      - name: Build image
        run: docker build --tag hamster-wheel:ci .

      - name: Serve traffic from the image
        run: |
          docker run --detach --name hamster-ci --publish 8080:8080 hamster-wheel:ci
          HAMSTER_SMOKE_PHP=yes timeout 120 ./scripts/smoke.sh http://127.0.0.1:8080 \
            || { docker logs hamster-ci; exit 1; }
          docker exec hamster-ci php -r 'printf("container PHP %s %s %d-bit\n", PHP_VERSION, PHP_ZTS ? "ZTS" : "NTS", PHP_INT_SIZE * 8);'

      - name: Stop container
        if: always()
        run: docker rm --force hamster-ci || true
