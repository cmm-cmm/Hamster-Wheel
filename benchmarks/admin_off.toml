# Baseline arm for the observability A/B: no [server.admin], so no counters
# and no administrative listener.
[server]
listen = "127.0.0.1:8080"

[[hosts]]
name = "localhost"
aliases = ["127.0.0.1"]

[[hosts.locations]]
path = "/api"
handler = "not_found"

[[hosts.locations]]
path = "/"
handler = "static"
root = "../public"
