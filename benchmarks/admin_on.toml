# Counter arm for the observability A/B: the baseline arm plus one section.
# The admin listener is scraped by nothing during the run.
[server]
listen = "127.0.0.1:8080"

[server.admin]
listen = "127.0.0.1:19090"

[[hosts]]
name = "localhost"
aliases = ["127.0.0.1"]

[[hosts.locations]]
path = "/api"
handler = "not_found"

[[hosts.locations]]
path = "/"
handler = "static"
root = "../public"
