# Configuration baked into the container image (see Dockerfile).
# Paths are absolute because the image installs the server under /srv/hamster
# and the process starts with an unspecified working directory.

[server]
# Containers must bind every interface; the port is remapped by the host.
listen = "0.0.0.0:8080"

[[hosts]]
name = "localhost"
aliases = ["127.0.0.1"]

[[hosts.locations]]
path = "/api"
handler = "not_found"

[[hosts.locations]]
path = "/php"
handler = "php_worker"

[hosts.locations.php]
# The php:8.5-cli base image; non-thread-safe and 64-bit, asserted at build time.
executable = "/usr/local/bin/php"
script = "/srv/hamster/fixtures/php-worker/worker.php"

[[hosts.locations]]
path = "/"
handler = "static"
root = "/srv/hamster/public"
